services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      - track
    # `default` keeps nginx able to reach `track` by name; `dokploy-network`
    # is what Traefik routes the public domain through.
    networks:
      - default
      - dokploy-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3

  track:
    build: ./server
    restart: unless-stopped
    volumes:
      - track-data:/data
    environment:
      LIBSQL_URL: file:/data/track.db
      # LIBSQL_AUTH_TOKEN: set when pointing LIBSQL_URL at a remote libsql/Turso instance
      ADMIN_TOKEN: ${TRACK_ADMIN_TOKEN:?set TRACK_ADMIN_TOKEN in .env}
      IP_HASH_SECRET: ${TRACK_IP_HASH_SECRET:?set TRACK_IP_HASH_SECRET in .env}
      # Lock these down in production:
      ALLOWED_ORIGINS: ${TRACK_ALLOWED_ORIGINS:-}
      PARTNERS: ${TRACK_PARTNERS:-}
      AFFILIATES: ${TRACK_AFFILIATES:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  track-data:

networks:
  dokploy-network:
    external: true
