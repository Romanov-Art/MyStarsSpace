# First DDoS layer for the track API: per-IP request rate (the app has its own
# per-IP limit as a second layer). Real volumetric DDoS needs a CDN/WAF in front.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 1k;
        # Docker DNS + variable: re-resolve `track` per request, so a restarted
        # track container (new IP) doesn't leave nginx pointing at a dead one
        resolver 127.0.0.11 valid=10s;
        set $track_upstream http://track:8787;
        proxy_pass $track_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
}
