# Production deploy of mystars.space to Cloudflare on every push to main:
#   landing (Vite build → Workers Static Assets) + track API (Worker + D1)
#   + the GiftsCanva proxy Worker for canva.mystars.space.
# Tests gate the deploy: site unit tests, worker typecheck and worker tests.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/package-lock.json

      - name: Install site dependencies
        run: npm ci --no-audit --no-fund

      - name: Site tests
        run: npm test

      - name: Build landing
        run: npm run build

      - name: Install worker dependencies
        working-directory: workers
        run: npm ci --no-audit --no-fund

      - name: Worker typecheck
        working-directory: workers
        run: npm run typecheck

      - name: Worker tests
        working-directory: workers
        run: npm test

      - name: Migrate D1 and deploy Workers
        working-directory: workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
